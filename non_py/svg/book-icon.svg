<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Soft rounded card background -->
  <rect x="16" y="16" width="480" height="480" rx="92" ry="92" fill="#1e3a8a"/>
  <!-- Glowing page block (the book) -->
  <rect x="104" y="120" width="304" height="288" rx="20" ry="20" fill="#ffffff"/>
  <!-- Spine shadow -->
  <rect x="104" y="120" width="46" height="288" rx="20" ry="20" fill="#e0e7ff"/>
  <!-- Text lines on the cover -->
  <rect x="176" y="176" width="188" height="16" rx="8" ry="8" fill="#bfdbfe"/>
  <rect x="176" y="216" width="188" height="16" rx="8" ry="8" fill="#93c5fd"/>
  <rect x="176" y="256" width="140" height="16" rx="8" ry="8" fill="#93c5fd"/>
  <rect x="176" y="296" width="168" height="16" rx="8" ry="8" fill="#bfdbfe"/>
  <!-- Bottom page edges -->
  <rect x="150" y="388" width="212" height="18" rx="9" ry="9" fill="#cbd5e1"/>
  <!-- Bookmark ribbon -->
  <polygon points="300,120 344,120 344,178 322,162 300,178" fill="#2563eb"/>
</svg>
